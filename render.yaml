services:
  - type: web
    name: llm-harness
    runtime: python
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: python app.py
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: RENDER
        value: "true"
